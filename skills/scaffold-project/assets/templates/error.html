{% extends "base.html" %}
{% block title %}{{ code }} — {{ heading }} · {{ site_name }}{% endblock %}
{% block meta_robots %}noindex,nofollow{% endblock %}
{% block content %}
<section class="text-center py-5" role="alert">
    <div class="text-body-secondary small text-uppercase mb-2">Error {{ code }} · {{ status_label }}</div>
    <h1 class="display-3 mb-2">{{ code }}</h1>
    <h2 class="h4 mb-3">{{ heading }}</h2>
    <p class="text-body-secondary mb-4">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go home</a>
</section>
{% endblock %}
